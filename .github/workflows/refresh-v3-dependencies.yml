name: Refresh Reviewed v3 Dependencies

on:
  push:
    branches: [feat/web-platform-v3-ios-admin]
    paths:
      - '.github/workflows/refresh-v3-dependencies.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/feat/web-platform-v3-ios-admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without lifecycle scripts
        run: |
          npm pkg set 'dependencies.next=16.4.3' 'dependencies.zod=4.6.7'
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --omit=dev || echo "Audit still needs attention; CI will remain red."
      - name: Commit exact dependency manifest and lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(deps): upgrade Next and Zod and refresh audited runtime lockfile"
            git push origin HEAD:feat/web-platform-v3-ios-admin
          fi
